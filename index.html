<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дашборды Измайлонга</title>
  <meta name="description" content="Результаты Измайлонга на крупных стартах">
  <style>
    :root{color-scheme:light;--green:#123f30;--accent:#24964b;--paper:#f4f1e8;--card:#fffefa;--line:#d7dfd8}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--green);font-family:Inter,Arial,sans-serif}
    main{width:min(900px,calc(100% - 32px));margin:0 auto;padding:64px 0 96px}
    p.eyebrow{margin:0 0 14px;color:var(--accent);font-size:13px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
    h1{max-width:720px;margin:0 0 18px;font-size:clamp(42px,7vw,76px);line-height:.95;letter-spacing:-.055em}
    .lead{max-width:620px;margin:0 0 48px;color:#64716c;font-size:clamp(18px,2.5vw,23px);line-height:1.45}
    article{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;padding:28px;border:1px solid var(--line);border-radius:26px;background:var(--card);box-shadow:0 18px 50px rgba(18,63,48,.07)}
    article small{display:block;margin-bottom:10px;color:var(--accent);font-weight:800;letter-spacing:.1em;text-transform:uppercase}
    article h2{margin:0 0 8px;font-size:clamp(25px,4vw,38px);letter-spacing:-.035em}
    article p{margin:0;color:#68746f;line-height:1.5}
    a{display:inline-flex;min-height:48px;align-items:center;padding:0 20px;border-radius:999px;background:var(--green);color:white;font-weight:750;text-decoration:none;white-space:nowrap}
    a:hover{background:var(--accent)}
    @media(max-width:640px){main{padding:42px 0 64px}article{grid-template-columns:1fr}a{justify-content:center}}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Izmylong running community</p>
    <h1>Дашборды крупных стартов</h1>
    <p class="lead">Результаты сообщества, распределения финишей и персональные итоги участников.</p>
    <article>
      <div>
        <small>2–3 мая 2026</small>
        <h2>Казанский марафон</h2>
        <p>89 результатов на дистанциях 42,2 км, 21,1 км и 10 км.</p>
      </div>
      <a href="./dashboards/kazan-2026/">Смотреть результаты →</a>
    </article>
  </main>
</body>
</html>
